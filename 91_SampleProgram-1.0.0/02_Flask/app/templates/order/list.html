{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h2 class="fw-bold mb-4">ご注文履歴</h2>
    {% if orders %}
        <div class="card nordic-card shadow-sm overflow-hidden">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                    <tr><th>注文番号</th><th>日時</th><th>金額</th><th>状態</th><th></th></tr>
                </thead>
                <tbody>
                    {% for o in orders %}
                        <tr>
                            <td class="fw-bold">#{{ o.order_number }}</td>
                            <td class="small text-muted">{{ o.created_at.strftime('%Y/%m/%d %H:%M') }}</td>
                            <td class="fw-bold text-success">&yen;{{ "{:,}".format(o.total_price) }}</td>
                            <td><span class="badge bg-light text-success border rounded-pill">{{ o.status_label }}</span></td>
                            <td><a href="{{ url_for('main.order_detail', order_number=o.order_number) }}" class="btn btn-sm btn-outline-secondary rounded-pill">詳細</a></td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <div class="card nordic-card py-5 text-center shadow-sm"><p class="text-muted">ご注文履歴はありません。</p></div>
    {% endif %}
</div>
{% endblock %}
