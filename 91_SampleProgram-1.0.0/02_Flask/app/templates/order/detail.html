{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h2 class="fw-bold mb-3">ご注文詳細 (#{{ order.order_number }})</h2>
    <div class="card nordic-card p-4 shadow-sm mb-4">
        <table class="table mb-0">
            {% for item in order.items %}
                <tr>
                    <td>{{ item.product_name }}</td>
                    <td class="text-center">{{ item.quantity }} 点</td>
                    <td class="text-end fw-bold">&yen;{{ "{:,}".format(item.subtotal) }}</td>
                </tr>
            {% endfor %}
            <tr class="fw-bold fs-5">
                <td colspan="2">合計お支払い金額</td>
                <td class="text-end text-success">&yen;{{ "{:,}".format(order.total_price) }}</td>
            </tr>
        </table>
    </div>
</div>
{% endblock %}
