{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h2 class="fw-bold mb-4">お届け先情報の入力</h2>
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card nordic-card p-4 shadow-sm">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">お名前 <span class="text-danger">*</span></label>
                        <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name if current_user.is_authenticated else '' }}" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-bold">メール <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" value="{{ current_user.email if current_user.is_authenticated else '' }}" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">電話番号 <span class="text-danger">*</span></label>
                            <input type="text" name="phone_number" class="form-control" required>
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-4">
                            <label class="form-label fw-bold">郵便番号 <span class="text-danger">*</span></label>
                            <input type="text" name="postal_code" class="form-control" required>
                        </div>
                        <div class="col-8">
                            <label class="form-label fw-bold">住所 <span class="text-danger">*</span></label>
                            <input type="text" name="address" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">お支払方法</label>
                        <select name="payment_method" class="form-select">
                            <option value="credit_card">クレジットカード決済</option>
                            <option value="bank_transfer">銀行振込</option>
                            <option value="cod">代金引換</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-nordic btn-lg w-100 rounded-pill fw-bold">注文を確定する</button>
                </form>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card nordic-card p-4 shadow-sm">
                <h5 class="fw-bold mb-3">ご注文内容</h5>
                {% for item in cart %}
                    <div class="d-flex justify-content-between py-2 border-bottom small">
                        <span>{{ item.product.name }} &times; {{ item.quantity }}</span>
                        <span class="fw-bold">&yen;{{ "{:,}".format(item.total_price) }}</span>
                    </div>
                {% endfor %}
                <div class="d-flex justify-content-between pt-3 fs-5 fw-bold">
                    <span>合計</span>
                    <span class="text-success">&yen;{{ "{:,}".format(cart.total_price) }}</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
