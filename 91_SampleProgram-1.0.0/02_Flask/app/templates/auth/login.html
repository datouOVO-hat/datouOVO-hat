{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 420px;">
    <div class="card nordic-card p-4 shadow-sm">
        <h3 class="fw-bold text-center mb-3">ログイン</h3>
        <form method="post">
            <div class="mb-3">
                <label class="form-label fw-bold small">ユーザー名</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small">パスワード</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-nordic w-100 rounded-pill py-2 fw-bold">ログイン</button>
        </form>
    </div>
</div>
{% endblock %}
