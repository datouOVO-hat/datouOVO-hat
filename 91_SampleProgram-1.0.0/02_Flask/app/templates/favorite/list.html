{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h2 class="fw-bold mb-4">お気に入りアイテム</h2>
    {% if favorites %}
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
            {% for fav in favorites %}
                <div class="col">
                    <div class="card nordic-card h-100 p-2 text-center">
                        <a href="{{ url_for('main.product_detail', id=fav.product.id) }}" class="text-decoration-none">
                            <img src="{{ url_for('main.media_file', filename=fav.product.image_url.replace('media/', '')) }}" class="img-fluid rounded mb-2" style="height: 160px; width: 100%; object-fit: cover;">
                            <div class="text-dark fw-bold small text-truncate">{{ fav.product.name }}</div>
                            <div class="text-success fw-bold">&yen;{{ "{:,}".format(fav.product.price) }}</div>
                        </a>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="card nordic-card py-5 text-center shadow-sm"><p class="text-muted">お気に入りは空です。</p></div>
    {% endif %}
</div>
{% endblock %}
